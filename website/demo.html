<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>BetBanish pause preview</title>
  <link rel="stylesheet" href="../overlay.css">
  <link rel="stylesheet" href="demo.css">
  <script src="demo.js"></script>
  <script src="../sites.js" defer></script>
  <script src="../currency.js" defer></script>

<body>
  <main id="demo-result" hidden tabindex="-1">
    <img src="../icons/icon48.png" alt="" width="48" height="48">

    <p id="result-description"></p>
    <p class="sample-note">This is a preview. No betting website has been opened.</p>
    <button type="button" id="replay">Try the pause again</button>
