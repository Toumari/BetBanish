<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BetBanish promotional tile</title>
  <style>
    * { box-sizing: border-box; }
    body { width: 440px; height: 280px; margin: 0; overflow: hidden; background: oklch(22% 0.009 25); color: oklch(97% 0.006 65); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    main { height: 100%; padding: 30px 32px; position: relative; }
    header { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 750; letter-spacing: -0.8px; }
    header img { width: 34px; height: 34px; }
    h1 { font-size: 37px; line-height: 1.08; letter-spacing: -1.2px; margin: 32px 0 0; font-weight: 700; max-width: 310px; }
    .pause { position: absolute; right: 34px; bottom: 35px; display: flex; gap: 9px; }
    .pause i { display: block; width: 10px; height: 41px; border-radius: 3px; background: oklch(60% 0.21 27); }
    p { margin: 18px 0 0; font-size: 13px; color: oklch(78% 0.008 65); }
  </style>
</head>
<body>
  <main>
    <header><img src="icons/icon48.png" alt="">BetBanish</header>
    <h1>A moment<br>to choose.</h1>
    <p>Pause before you gamble.</p>
    <div class="pause" aria-hidden="true"><i></i><i></i></div>
  </main>
</body>
</html>
